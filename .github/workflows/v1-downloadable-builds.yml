name: V1 downloadable test builds

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase-20-v1-artifacts

permissions:
  contents: read

concurrency:
  group: v1-downloadable-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e

  windows:
    name: Windows x64 test package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run dist -- --win --x64
      - run: npm run test:package
      - name: Create checksums
        shell: pwsh
        run: |
          Get-FileHash 'release/PaperMind Setup *.exe' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) *$([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: papermind-windows-x64-${{ github.sha }}
          path: |
            release/PaperMind Setup *.exe
            release/PaperMind Setup *.exe.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }} unsigned test package
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build unsigned macOS test package
        run: >-
          npx electron-builder --mac --${{ matrix.arch }}
          -c.mac.identity=null -c.mac.hardenedRuntime=false
      - run: npm run test:package
      - name: Create checksums
        run: shasum -a 256 release/*.dmg release/*-mac.zip > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: papermind-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
